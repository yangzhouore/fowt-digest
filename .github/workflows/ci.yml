name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run pipeline tests
        run: python -m pytest pipeline/tests

      - name: Check diff whitespace
        run: git diff --check

  web:
    name: Website validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Validate static digest data
        run: npm run validate:data

      - name: Run static digest data tests
        run: npm run test:data

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build
