name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependency
        run: python -m pip install pytest

      - name: Run pipeline tests
        run: python -m pytest pipeline/tests

      - name: Check diff whitespace
        run: git diff --check

  web:
    name: Website validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Validate static digest data
        run: npm run validate:data

      - name: Run static digest data tests
        run: npm run test:data

      - name: Lint website
        run: npm run lint

      - name: Build website
        run: npm run build

  browser-smoke:
    name: Browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Browsers and OS dependencies are preinstalled: avoid a fresh apt download
    # consuming the job budget. Keep this image/digest and version check aligned
    # with @playwright/test in web/package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: Verify Playwright image compatibility
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.63.0', 'Update the pinned Playwright image/digest and compatibility check when upgrading @playwright/test')"

      - name: Build website
        run: npm run build

      - name: Run browser smoke tests
        run: npm run test:smoke

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
